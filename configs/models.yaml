# Model registry: detailed local-first model options with metadata
# Each capability lists multiple model options ordered by preference.
# Selector/adapter should use `profiles` to pick among these (local-first, balanced, quality-first).

planner:
  models:
    - id: qwen3
      label: Qwen3 (default, requires SDK)
      tier: premium
      resources:
        gpu: true
        vram_gb: 24
        cpu_threads: 4
      local_compatible: true
      production_ready: true
      adapter: planner_qwen3
    - id: gemma3-27b-it
      label: Gemma 3 27B IT (requires SDK)
      tier: premium
      resources:
        gpu: true
        vram_gb: 48
      local_compatible: true
      production_ready: false
      adapter: planner_gemma3
    - id: flan-t5-small
      label: Flan-T5 small (HF)
