# Adapter-specific configuration (optional). Keys are model identifiers.
adapters:
  faster-whisper:
    model: large-v3
  diffusers-sd:
    model_id: runwayml/stable-diffusion-v1-5
    torch_dtype: float16
  whisper:
    model: small

# Runtime selection profiles: how to pick among model tiers.
profiles:
  local-first:
    prefer_tiers: [default, lightweight, premium]
    allow_cloud: false
  balanced:
    prefer_tiers: [default, premium, lightweight]
    allow_cloud: false
  quality-first:
    prefer_tiers: [premium, default, lightweight]
    allow_cloud: false

# Health-check settings
health:
  enable_probes: true
  probe_timeout_s: 15

# Local-first policy: prefer local and open-source models by default
policy:
  local_first: true
  allow_cloud_providers: false
  prefer_permissive_license: true
  profiles_default: local-first
